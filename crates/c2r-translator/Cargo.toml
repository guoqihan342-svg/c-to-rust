[package]
name = "c2r-translator"
version = "0.1.0"
edition = "2021"

[lib]
name = "c2r_translator"
path = "src/lib.rs"

[features]
default = []
clang-frontend = []
clang-lowering-report = ["clang-frontend", "typed-ir"]
typed-ir = []

[dependencies]
quote = "=1.0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "=2.0.118", features = ["full", "visit"] }
